<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HoverFont</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #171717;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 20px;
      line-height: 1.2;
    }

    .subtitle {
      margin: 0 0 14px;
      color: #666666;
      font-size: 12px;
      line-height: 1.45;
    }

    #toggleButton {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      background: #1f1f1f;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    #toggleButton:hover {
      opacity: 0.92;
    }

    #toggleButton:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #status {
      min-height: 18px;
      margin: 10px 0 0;
      font-size: 11px;
      line-height: 1.4;
      color: #666666;
    }

    #status[data-type="success"] {
      color: #137333;
    }

    #status[data-type="error"] {
      color: #b3261e;
    }
  </style>
</head>
<body>
  <h1>HoverFont</h1>
  <p class="subtitle">Hover over text to inspect the typography being used.</p>

  <button id="toggleButton" type="button">Turn HoverFont on</button>
  <p id="status" aria-live="polite">Ready.</p>

  <script src="popup.js"></script>
</body>
</html>
